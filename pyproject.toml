[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "contractwatch"
description = "API contract guard for FastAPI: catch breaking changes and schema-name collisions before they ship."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "ContractWatch" }]
keywords = ["fastapi", "openapi", "api", "contract", "pre-commit", "breaking-changes"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Framework :: FastAPI",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
]
dynamic = ["version"]
dependencies = [
  "typer>=0.12",
  "rich>=13.7",
  "pydantic>=2.5",
  "PyYAML>=6.0",
]

[project.urls]
Homepage = "https://github.com/himanshu007-creator/contractwatch"
Issues = "https://github.com/himanshu007-creator/contractwatch/issues"

[project.optional-dependencies]
fastapi = ["fastapi>=0.110"]

[project.scripts]
contractwatch = "contractwatch.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "pytest-timeout>=2.3",
  "mypy>=1.10",
  "ruff>=0.5",
  "build>=1.2",
  "fastapi>=0.110",
  "httpx>=0.27",
  "pre-commit>=3.7",
]

[tool.hatch.version]
path = "src/contractwatch/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/contractwatch"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"src/contractwatch/cli.py" = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
files = ["src/contractwatch"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["yaml.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "integration: exercises real subprocesses, git, or FastAPI apps",
  "slow: longer-running performance fixtures",
]
filterwarnings = ["ignore::DeprecationWarning"]
